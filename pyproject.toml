[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "nerdbot"
version = "0.1.0"
description = "Persistent AI teammate workspace — project, teammate, task, run"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{name = "nerdbot contributors"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<2.14",
    "click>=8.1",
    "httpx>=0.27",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
nerdbot = "nerdbot.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/nerdbot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "tests"]
include = ["*.py", "*.pyi", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in defaults is the framework's standard DI idiom.
"backend/src/nerdbot/api.py" = ["B008"]
"backend/src/nerdbot/boards.py" = ["B008"]
# sqlite3.Row is tuple-like: `in` tests values, so `.keys()` is required.
"backend/src/nerdbot/store.py" = ["SIM118"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["backend/src/nerdbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that hit external services (skipped by default)",
]
