services:
  nerdbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: nerdbot:local
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NERDBOT_DB: ${NERDBOT_DB:-/app/.nerdbot-data/nerdbot.db}
      NERDBOT_DATA: ${NERDBOT_DATA:-/app/.nerdbot-data}
    volumes:
      - nerdbot-data:/app/.nerdbot-data
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: nerdbot-dashboard:local
    ports:
      - "5173:80"
    depends_on:
      - nerdbot
    restart: unless-stopped

volumes:
  nerdbot-data:
