services:
  nerdbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: nerdbot:local
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NERDBOT_DB: ${NERDBOT_DB:-/app/.nerdbot-data/nerdbot.db}
      NERDBOT_DATA: ${NERDBOT_DATA:-/app/.nerdbot-data}
      # Run the background executor in the API process so queued work advances
      # without a manual sweep. Interval and per-run timeout are tuned for
      # hosted providers, which can take longer than a local model.
      NERDBOT_EXECUTOR: ${NERDBOT_EXECUTOR:-1}
      NERDBOT_EXECUTOR_INTERVAL_S: ${NERDBOT_EXECUTOR_INTERVAL_S:-15}
      NERDBOT_RUN_TIMEOUT_S: ${NERDBOT_RUN_TIMEOUT_S:-300}
      # Optional: opt-in host mount mapping. Default unset keeps workspaces inside
      # the container's named data volume. See README "Workspace mounts (opt-in)".
      # NERDBOT_WORKSPACE_MOUNTS: /host/path=/container/path
    volumes:
      - nerdbot-data:/app/.nerdbot-data
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: nerdbot-dashboard:local
    ports:
      - "5173:80"
    depends_on:
      - nerdbot
    restart: unless-stopped

volumes:
  nerdbot-data:
