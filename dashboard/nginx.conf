server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The dashboard talks to the API through this path, so the browser only
  # ever makes same-origin requests. That keeps the app working under
  # Chrome's local-network policy, and it is the same shape a normal
  # reverse-proxied deployment uses.
  location /api/ {
    proxy_pass http://nerdbot:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Chat, run events, and terminals stream over SSE: never buffer them.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
